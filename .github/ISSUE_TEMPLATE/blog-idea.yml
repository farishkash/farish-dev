name: Blog idea
description: Capture a thought before it turns into a full draft.
title: "[Post idea] "
body:
  - type: textarea
    id: idea
    attributes:
      label: Core idea
      description: What is the thought, argument, question, or observation?
      placeholder: The thing I keep coming back to is...
    validations:
      required: true
  - type: textarea
    id: angle
    attributes:
      label: Possible angle
      description: What makes this worth a post rather than a note?
  - type: dropdown
    id: category
    attributes:
      label: Likely category
      description: Pick the broadest primary category. This can change later.
      options:
        - AI in Practice
        - Software & Building
        - Technical Education
        - Work
  - type: textarea
    id: notes
    attributes:
      label: Notes and examples
      description: Stories, examples, links, counterarguments, or fragments to remember.
  - type: input
    id: tags
    attributes:
      label: Possible tags
      placeholder: Coding Agents, Developer Tools, Learning, Leadership
